parameters:
    app.strava.client_id: '%env(STRAVA_CLIENT_ID)%'
    app.strava.client_secret: '%env(STRAVA_CLIENT_SECRET)%'
    app.strava.refresh_token: '%env(STRAVA_REFRESH_TOKEN)%'
    app.map.osm_user_agent: '%env(OSM_TILE_USER_AGENT)%'
    app.map.osm_tile_url: '%env(OSM_TILE_URL_TEMPLATE)%'
    app.map.cache_dir: '%kernel.project_dir%/var/maps'
    app.map.tile_cache_dir: '%kernel.project_dir%/var/tiles'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $stravaClientId: '%app.strava.client_id%'
            string $stravaClientSecret: '%app.strava.client_secret%'
            string $stravaRefreshToken: '%app.strava.refresh_token%'
            string $osmUserAgent: '%app.map.osm_user_agent%'
            string $osmTileUrlTemplate: '%app.map.osm_tile_url%'
            string $mapCacheDir: '%app.map.cache_dir%'
            string $tileCacheDir: '%app.map.tile_cache_dir%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\Map\Background\BackgroundRendererInterface:
        alias: App\Service\Map\Background\TileBackgroundRenderer

    _instanceof:
        App\Service\Map\Background\BackgroundRendererInterface:
            tags: ['app.map.background_renderer']
