name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 for JS-based actions ahead of the September 2026 forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  qa:
    name: Static analysis & code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read PHP version
        id: php
        run: echo "version=$(cat .php-version)" >> "$GITHUB_OUTPUT"

      - name: Verify PHP version consistency
        run: |
          set -e
          PHP="${{ steps.php.outputs.version }}"
          COMPOSER_PLATFORM=$(grep -A1 '"platform"' composer.json | grep '"php"' | sed -E 's/.*"php"[[:space:]]*:[[:space:]]*"([0-9]+\.[0-9]+).*/\1/')
          DOCKERFILE_DEFAULT=$(grep '^ARG PHP_VERSION=' docker/app/Dockerfile | cut -d= -f2)
          if [ "$PHP" != "$COMPOSER_PLATFORM" ]; then
            echo "::error::.php-version ($PHP) and composer.json config.platform.php ($COMPOSER_PLATFORM) disagree"
            exit 1
          fi
          if [ "$PHP" != "$DOCKERFILE_DEFAULT" ]; then
            echo "::error::.php-version ($PHP) and docker/app/Dockerfile ARG PHP_VERSION ($DOCKERFILE_DEFAULT) disagree"
            exit 1
          fi
          echo "PHP version is $PHP everywhere — OK."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          extensions: intl, pdo_pgsql, pgsql, redis, imagick, zip, gd, bcmath, opcache
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}

      - run: composer install --no-progress --no-interaction --prefer-dist

      - name: PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Lint YAML
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint Twig
        run: php bin/console lint:twig templates

      - name: Lint Symfony container
        run: php bin/console lint:container

      - name: Validate Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync --skip-mapping || true

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: strava
          POSTGRES_PASSWORD: strava
          POSTGRES_DB: strava_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strava -d strava_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Read PHP version
        id: php
        run: echo "version=$(cat .php-version)" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          extensions: intl, pdo_pgsql, pgsql, redis, imagick, zip, gd, bcmath, opcache
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}

      - run: composer install --no-progress --no-interaction --prefer-dist

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://strava:strava@127.0.0.1:5432/strava_test?serverVersion=16
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always
